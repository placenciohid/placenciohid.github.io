<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Production forecast error comparison</title><desc id="desc">The reported reduction is shown as an index: baseline 100, model 79. It is not a plot of raw production data.</desc><rect x="0" y="0" width="1000" height="420" rx="0" fill="#14223a"/><text x="50" y="55" fill="#dce8f8" font-family="Arial,sans-serif" font-size="28" font-weight="600">Production forecast error</text><text x="50" y="88" fill="#a8bbd5" font-family="Arial,sans-serif" font-size="18" font-weight="400">Indexed comparison · lower is better</text><text x="50" y="168" fill="#dce8f8" font-family="Arial,sans-serif" font-size="22" font-weight="400">Prior baseline</text><rect x="270" y="135" width="580" height="52" rx="6" fill="#667c9e"/><text x="875" y="171" fill="#dce8f8" font-family="Arial,sans-serif" font-size="27" font-weight="600">100</text><text x="50" y="261" fill="#dce8f8" font-family="Arial,sans-serif" font-size="22" font-weight="400">Forecast model</text><rect x="270" y="228" width="458.2" height="52" rx="6" fill="#68d4c0"/><text x="750" y="264" fill="#68d4c0" font-family="Arial,sans-serif" font-size="27" font-weight="600">79</text><text x="50" y="353" fill="#fff" font-family="Arial,sans-serif" font-size="33" font-weight="600">21% lower error</text><text x="50" y="389" fill="#a8bbd5" font-family="Arial,sans-serif" font-size="18" font-weight="400">365-day forecast horizon · reported project result</text></svg>
