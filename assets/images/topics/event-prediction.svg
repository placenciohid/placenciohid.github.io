<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Predicting future events</title><desc id="desc">Past events become features; future events become labels</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c9e7ff" stroke-opacity=".04"/></pattern></defs><rect width="1200" height="640" fill="#102039"/><rect width="1200" height="640" fill="url(#grid)"/><text x="65" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="600">Predicting future events</text><text x="65" y="110" fill="#9ab2cd" font-family="Arial,sans-serif" font-size="19" font-weight="400">Past events become features; future events become labels</text><path d="M95,330 L1110,330" fill="none" stroke="#82baff" stroke-width="3"/><path d="M700,170 L700,490" fill="none" stroke="#f0c47d" stroke-width="3" stroke-dasharray="8 7"/><text x="120" y="200" fill="#d9e9ff" font-family="Arial,sans-serif" font-size="23" font-weight="400">FEATURES: KNOWN HISTORY</text><text x="745" y="200" fill="#66ead0" font-family="Arial,sans-serif" font-size="23" font-weight="400">LABEL: NEXT 7 DAYS</text><circle cx="200" cy="330" r="13" fill="#82baff"/><text x="130" y="390" fill="#d9e9ff" font-family="Arial,sans-serif" font-size="22" font-weight="400">Event starts</text><circle cx="425" cy="330" r="13" fill="#82baff"/><text x="355" y="390" fill="#d9e9ff" font-family="Arial,sans-serif" font-size="22" font-weight="400">Resolved</text><circle cx="910" cy="330" r="13" fill="#66ead0"/><text x="840" y="390" fill="#d9e9ff" font-family="Arial,sans-serif" font-size="22" font-weight="400">New event</text><text x="635" y="530" fill="#f0c47d" font-family="Arial,sans-serif" font-size="22" font-weight="400">AS-OF CUTOFF</text><text x="65" y="605" fill="#9ab2cd" font-family="Arial,sans-serif" font-size="15" font-weight="400">DARÍO PLACENCIO  /  TECHNICAL PORTFOLIO</text></svg>
