<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Collections reporting and reconciliation workflow</title><desc id="desc">Source records are transformed into aging and matching views for follow-up.</desc><rect x="0" y="0" width="1000" height="420" rx="0" fill="#14223a"/><text x="50" y="55" fill="#dce8f8" font-family="Arial,sans-serif" font-size="28" font-weight="600">Collections workflow</text><text x="50" y="92" fill="#a8bbd5" font-family="Arial,sans-serif" font-size="20" font-weight="400">An hourly view, with exceptions ready for review</text><rect x="50" y="155" width="260" height="120" rx="6" fill="#263952"/><text x="70" y="198" fill="#dce8f8" font-family="Arial,sans-serif" font-size="23" font-weight="600">Source records</text><text x="70" y="239" fill="#a8bbd5" font-family="Arial,sans-serif" font-size="18" font-weight="400">Invoices + payments</text><rect x="370" y="155" width="260" height="120" rx="6" fill="#263952"/><text x="390" y="198" fill="#dce8f8" font-family="Arial,sans-serif" font-size="23" font-weight="600">Aging + matching</text><text x="390" y="239" fill="#a8bbd5" font-family="Arial,sans-serif" font-size="18" font-weight="400">Customer and currency</text><rect x="690" y="155" width="260" height="120" rx="6" fill="#263952"/><text x="710" y="198" fill="#dce8f8" font-family="Arial,sans-serif" font-size="23" font-weight="600">Review queue</text><text x="710" y="239" fill="#a8bbd5" font-family="Arial,sans-serif" font-size="18" font-weight="400">Priorities + exceptions</text><path d="M315 215H365 M635 215H685" stroke="#68d4c0" stroke-width="3"/><text x="50" y="345" fill="#68d4c0" font-family="Arial,sans-serif" font-size="31" font-weight="600">Hourly aging feed</text><text x="50" y="386" fill="#a8bbd5" font-family="Arial,sans-serif" font-size="20" font-weight="400">Shared collections reporting + document-level reconciliation</text></svg>
