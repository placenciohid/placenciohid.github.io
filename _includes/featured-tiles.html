<section class="tiles" aria-label="Selected work">
{% for tile in tiles %}
  <article>
    <span class="image"><img src="{{ tile.image | relative_url }}" alt="" loading="lazy" /></span>
    <header class="major"><h3><a href="{{ tile.url | relative_url }}" class="link">{{ tile.title }}</a></h3><p>{{ tile.description }}</p></header>
  </article>
{% endfor %}
</section>
