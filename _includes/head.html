<head>
  <meta charset="utf-8" />
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}Darío Placencio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{ page.description | default: site.description | escape }}" />
  {% assign canonical_path = page.canonical_url | default: page.url %}
  <link rel="canonical" href="{{ canonical_path | absolute_url }}" />
  <meta property="og:title" content="{{ page.title | default: site.title | escape }} — Darío Placencio" />
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}" />
  <meta property="og:url" content="{{ canonical_path | absolute_url }}" />
  <meta property="og:type" content="{% if page.project_id %}article{% else %}website{% endif %}" />
  {% assign social_project = site.data.projects[page.project_id] %}
  {% assign social_image = social_project.photo | default: '/assets/images/photos/copper-mine.jpg' %}
  <meta property="og:image" content="{{ social_image | absolute_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  <link rel="stylesheet" href="{{ '/assets/css/professional.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  <noscript><style>#header nav .desktop-link{display:block}#header .menu-toggle,#header nav .desktop-link[href^="https"]{display:none}</style></noscript>
</head>
