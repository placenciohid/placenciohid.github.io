{% assign evidence = site.data.projects[page.project_id] %}
{% if evidence %}
<aside class="project-evidence" aria-label="Project source and evidence"><p class="eyebrow">{{ evidence.type }}</p><a href="{{ evidence.github }}" class="button icon fa-github">Project code & notes</a></aside>
<figure class="project-photo"><img src="{{ evidence.photo | relative_url }}" alt="{{ evidence.photo_alt }}" /><figcaption>Photo: {{ evidence.photo_credit }} / Unsplash · <a href="{{ '/photo-credits.html' | relative_url }}">Photography credits</a></figcaption></figure>
{% endif %}
